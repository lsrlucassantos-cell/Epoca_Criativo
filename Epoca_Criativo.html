<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EventFlow — Roteiro de Evento</title>
<style>
:root{--bg:#070707;--card:#11110f;--text:#f5f5f5;--muted:#a7a397;--line:#2d2b24;--primary:#f2c300;--danger:#b42318;--shadow:0 12px 35px rgba(0,0,0,.45)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 12% 0%,rgba(242,195,0,.13),transparent 30%),radial-gradient(circle at 100% 100%,rgba(242,195,0,.08),transparent 30%),linear-gradient(135deg,#050505,#0b0b09 55%,#11100b);color:var(--text);font:14px "Segoe UI",Arial,sans-serif;min-height:100vh}
.container{max-width:1550px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:20px}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:2px;color:#e0b800;text-transform:uppercase}h1{margin:5px 0 0;font-size:30px;color:#fff}
.actions{display:flex;gap:9px;flex-wrap:wrap}button{border:0;border-radius:8px;padding:10px 15px;font-weight:700;cursor:pointer}.primary{background:var(--primary);color:#111}.secondary{background:#151512;border:1px solid #3b382c;color:#fff}
.card{background:rgba(17,17,15,.95);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);backdrop-filter:blur(8px)}.info{display:grid;grid-template-columns:2fr 1fr 1fr;gap:15px;padding:18px;margin-bottom:18px}
label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.4px;font-weight:800;color:var(--muted);margin-bottom:6px}
input,select,textarea{width:100%;border:1px solid #39372e;border-radius:7px;padding:9px 10px;background:#0b0b09;color:#f5f5f5;font:inherit}input:focus,select:focus,textarea:focus{outline:none;border-color:#dcb900;box-shadow:0 0 0 2px rgba(242,195,0,.12)}textarea{min-height:42px;resize:vertical}
.table-wrap{overflow:auto}table{width:100%;min-width:1250px;border-collapse:collapse}th{padding:12px 9px;background:#17160f;color:#e0b800;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.7px}
td{padding:8px;border-top:1px solid var(--line);vertical-align:top}.status-normal{background:#11110f}.status-entregue{background:#10261b}.status-processo{background:#29230c}.status-atrasado{background:#2b1110}
.status-select.entregue{border-color:#12b76a;background:#ecfdf3;color:#027a48;font-weight:700}.status-select.processo{border-color:#fdb022;background:#fffaeb;color:#b54708;font-weight:700}.status-select.atrasado{border-color:#f04438;background:#fef3f2;color:#b42318;font-weight:700}
.row-actions button{padding:7px 9px;background:#fee4e2;color:#b42318}.empty{text-align:center;padding:42px;color:var(--muted)}.footer{display:flex;justify-content:space-between;margin-top:14px;color:var(--muted);font-size:12px}
.legend{display:flex;gap:12px;flex-wrap:wrap}.dot{display:inline-flex;align-items:center;gap:5px}.circle{width:9px;height:9px;border-radius:50%}.green{background:#12b76a}.yellow{background:#fdb022}.red{background:#f04438}
@media(max-width:800px){.container{padding:15px}.top{flex-direction:column;align-items:flex-start}.info{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
<div class="top">
<div><div class="eyebrow">ÉPOCA CRIATIVO • PRODUÇÃO & COMUNICAÇÃO</div><h1>Época Criativo <span style="font-weight:400;color:#9c988d">— Roteiro de Evento</span></h1></div>
<div class="actions"><button class="secondary" onclick="novoEvento()">Novo evento</button><button class="secondary" onclick="salvar()">Salvar</button><button class="primary" onclick="adicionar()">+ Adicionar atividade</button></div>
</div>

<div class="card info">
<div><label>Nome do evento</label><input id="nome" placeholder="Ex.: Culto de Celebração"></div>
<div><label>Data do evento</label><input id="data" type="date"></div>
<div><label>Horário inicial</label><input id="inicio" type="time" value="19:00"></div>
</div>

<div class="card">
<div class="table-wrap">
<table>
<thead><tr>
<th>Hora</th><th>Tipo de atividade</th><th>Status</th><th>Comunicação</th><th>Quem irá executar</th><th>O que fazer</th><th>Comunicação / Observação</th><th>Ação</th>
</tr></thead>
<tbody id="tbody"></tbody>
</table>
<div id="empty" class="empty">Nenhuma atividade adicionada.<br><br><button class="primary" onclick="adicionar()">+ Adicionar primeira atividade</button></div>
</div>
</div>

<div class="footer">
<div id="count">0 atividades</div>
<div class="legend"><span class="dot"><i class="circle green"></i> Entregue</span><span class="dot"><i class="circle yellow"></i> Processo</span><span class="dot"><i class="circle red"></i> Atrasado</span></div>
</div>
</div>

<script>
const tipos=["Story","Feed","Projetor"],coms=["Fotografia","Conteúdo","Projeção"],pessoas=["Lucas","João","Thiago"],statuses=["Normal","Entregue","Processo","Atrasado"];
let rows=[];

function esc(s){return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function opts(a,v){return a.map(x=>`<option value="${esc(x)}" ${x===v?"selected":""}>${x}</option>`).join("")}
function nextTime(){
 if(!rows.length)return document.getElementById("inicio").value||"19:00";
 let [h,m]=rows[rows.length-1].hora.split(":").map(Number),t=h*60+m+5;
 return String(Math.floor(t/60)%24).padStart(2,"0")+":"+String(t%60).padStart(2,"0");
}
function adicionar(){
 rows.push({hora:nextTime(),tipo:"Story",status:"Normal",com:"Fotografia",pessoa:"Lucas",fazer:"",obs:""});
 render();saveSilent();
}
function render(){
 const tb=document.getElementById("tbody");tb.innerHTML="";
 document.getElementById("empty").style.display=rows.length?"none":"block";
 rows.forEach((r,i)=>{
   const tr=document.createElement("tr"); tr.className="status-"+r.status.toLowerCase();
   tr.innerHTML=`
   <td><input type="time" value="${r.hora}" onchange="setv(${i},'hora',this.value)"></td>
   <td><select onchange="setv(${i},'tipo',this.value)">${opts(tipos,r.tipo)}</select></td>
   <td><select class="status-select ${r.status.toLowerCase()}" onchange="manualStatus(${i},this.value)">${opts(statuses,r.status)}</select></td>
   <td><select onchange="setv(${i},'com',this.value)">${opts(coms,r.com)}</select></td>
   <td><select onchange="setv(${i},'pessoa',this.value)">${opts(pessoas,r.pessoa)}</select></td>
   <td><textarea placeholder="Descreva a atividade..." oninput="setv(${i},'fazer',this.value)">${esc(r.fazer)}</textarea></td>
   <td><textarea placeholder="Orientações ou informações..." oninput="setv(${i},'obs',this.value)">${esc(r.obs)}</textarea></td>
   <td class="row-actions"><button onclick="del(${i})">Excluir</button></td>`;
   tb.appendChild(tr);
 });
 document.getElementById("count").textContent=rows.length+" "+(rows.length===1?"atividade":"atividades");
}
function setv(i,k,v){rows[i][k]=v;saveSilent();}
function manualStatus(i,v){rows[i].status=v;render();saveSilent();}
function del(i){rows.splice(i,1);render();saveSilent();}
function autoStatus(){
 const date=document.getElementById("data").value;
 if(!date)return;
 const now=new Date();
 rows.forEach(r=>{
   if(r.status==="Normal"){
     const due=new Date(date+"T"+r.hora+":00");
     if(now>=due)r.status="Atrasado";
   }
 });
 render();saveSilent();
}
function saveSilent(){
 localStorage.setItem("eventflow_v2",JSON.stringify({nome:nome.value,data:data.value,inicio:inicio.value,rows}));
}
function salvar(){saveSilent();alert("Roteiro salvo com sucesso.");}
function carregar(){
 const s=localStorage.getItem("eventflow_v2");if(!s)return;
 try{const x=JSON.parse(s);nome.value=x.nome||"";data.value=x.data||"";inicio.value=x.inicio||"19:00";rows=x.rows||[]}catch(e){}
}
function novoEvento(){
 if(!confirm("Criar um novo evento? O roteiro atual será apagado deste navegador."))return;
 rows=[];nome.value="";data.value="";inicio.value="19:00";localStorage.removeItem("eventflow_v2");render();
}
nome.addEventListener("input",saveSilent);data.addEventListener("change",()=>{saveSilent();autoStatus()});inicio.addEventListener("change",saveSilent);
carregar();render();autoStatus();setInterval(autoStatus,30000);
</script>
</body>
</html>
